[package]
name = "stoneage-client"
version = "0.2.24"
edition = "2024"
rust-version = "1.88.0"
publish = false
description = "石器时代 2.5 命令行（TUI）客户端"
default-run = "stoneage"
repository = "https://github.com/athlan20/stoneage"
homepage = "https://github.com/athlan20/stoneage"

[lib]
name = "stoneage_client"
path = "src/lib.rs"

[[bin]]
name = "stoneage"
path = "src/main.rs"

[[bin]]
name = "mock-server"
path = "src/bin/mock_server/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
base64 = "0.22"
flate2 = "1.1.10"
ratatui = "0.30.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2"
ureq = "3"

[build-dependencies]
flate2 = "1.1.10"
serde_json = "1"

# cargo-dist 发布包用的 profile（STAGE-98）：和 release 一样，多开 thin LTO；本地开发不用它。
[profile.dist]
inherits = "release"
lto = "thin"
# 发布包不带符号表和调试信息，逆向时看不到函数名；源码路径由 release.yml 的 --remap-path-prefix 抹掉。
strip = "symbols"
debug = false
