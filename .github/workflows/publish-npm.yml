# STAGE-98：发布 npm 包。把发布包拆成按平台的子包（云效源码里的 client/npm/build.mjs），主包只放启动器。
# 由 release.yml 在 host 建好 GitHub Release 之后调用（源码仓库 dist-workspace.toml 的 publish-jobs），不要单独运行。
# 用 npm 的 Trusted Publishing（OIDC）发布，不需要 npm 令牌：stoneage-cli 和四个平台子包在 npmjs.com 上都要配置
# 可信发布者（GitHub Actions，仓库 athlan20/stoneage，Workflow filename 填外层的 release.yml，不是本文件）。
# 源码取自 release.yml 的 plan 任务上传的 codeup-source 包（CODEUP_TOKEN / CODEUP_URL 只在那里用）。
name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    # OIDC 换发布凭据需要 id-token: write；外层 release.yml 的调用处也要给同样的权限。
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PLAN: ${{ inputs.plan }}
    steps:
      # 不再自己去云效拉：release.yml 的 plan 任务已经带重试拉过一次并打成 codeup-source 包，
      # 这里再拉一次容易撞云效限流（v0.2.8 就是这样失败的）。
      - name: 取 plan 任务拉好的云效源码
        uses: actions/download-artifact@v8
        with:
          name: codeup-source
          path: codeup-source
      - name: 解开源码
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf codeup-source/source.tar.gz
          rm -rf codeup-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 升级 npm（可信发布要 11.5.1 或更新）
        run: npm install -g npm@^11.5.1 && npm --version
      - name: 下载 GitHub Release 上的发布包
        run: |
          tag="$(echo "$PLAN" | jq -r '.announcement_tag')"
          version="$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "stoneage-client") | .app_version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVES=$RUNNER_TEMP/archives" >> "$GITHUB_ENV"
          gh release download "$tag" --dir "$RUNNER_TEMP/archives" \
            --pattern 'stoneage-client-*.tar.xz' --pattern 'stoneage-client-*.zip'
      - name: 生成平台子包和主包
        run: node client/npm/build.mjs --version "$VERSION" --archives "$ARCHIVES" --out "$RUNNER_TEMP/npm"
      - name: 先发平台子包，最后发主包（已发布的版本跳过，失败后可以直接重跑）
        run: |
          publish() {
            local name version
            name="$(jq -r .name package.json)"
            version="$(jq -r .version package.json)"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} 已经在 npm 上，跳过"
            else
              npm publish
            fi
          }
          for dir in "$RUNNER_TEMP"/npm/stoneage-cli-*/; do
            (cd "$dir" && publish)
          done
          (cd "$RUNNER_TEMP/npm/stoneage-cli" && publish)
